<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>document.documentElement.classList.add("js");</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Çağan Efe Çalıdağ</title>
    <!-- SEO: every page needs its own description + canonical, otherwise Google
         picks a random sentence off the page and may fold this into the homepage
         as a duplicate. See the big SEO block in /index.html for the rest. -->
    <meta name="description" content="Get in touch with Çağan Efe Çalıdağ — full-stack developer. Contact form or email contact@cagancalidag.com.">
    <link rel="canonical" href="https://cagancalidag.com/pages/contact.html">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="theme-color" content="#111d1d">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="manifest" href="/manifest.json">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Contact | Çağan Efe Çalıdağ">
    <meta property="og:description" content="Get in touch with Çağan Efe Çalıdağ — full-stack developer.">
    <meta property="og:url" content="https://cagancalidag.com/pages/contact.html">
    <meta property="og:image" content="https://cagancalidag.com/files/images/og-image-1200.jpg">
    <meta property="og:site_name" content="Çağan Efe Çalıdağ | Developer">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://cagancalidag.com/files/images/og-image-1200.jpg">

    <!-- absolute paths everywhere. these used to be ../css/... which only worked
         from exactly this folder depth and broke the moment I moved a page. -->
    <link rel="preload" href="/css/fonts/Inter/Inter-var-subset.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="/css/style-main.css">
    <link rel="stylesheet" href="/css/contact.css">
    <script defer src="/js/dynamic-text.js"></script>
    <script defer src="/js/scramble.js"></script>
    <script defer src="/js/caret.js"></script>
</head>
<body>
    <!-- ===== site header. keep this identical on every page. ===== -->
    <header class="header" id="header">
        <div class="header-image">
            <a href="/" aria-label="Home">
                <img src="/files/images/icon-120.webp" alt="cagancalidag icon" width="120" height="120" decoding="async">
            </a>
        </div>
        <div class="header-nav">
            <nav aria-label="Main">
                <a data-value="About" href="/#about">About</a>
                <a data-value="Skills" href="/#skills">Skills</a>
                <a data-value="Projects" href="/#projects">Projects</a>
                <!-- <a data-value="CV" href="/pages/cv.html">CV</a> -->
                <a data-value="Contact" href="/pages/contact.html" aria-current="page">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="contact-wrapper" id="contactform">
            <div class="contact-text">
                <h1>Contact Me</h1>
                <p>Fill the form below or email me at <a href="mailto:contact@cagancalidag.com">contact@cagancalidag.com</a> to contact me.</p>
            </div>
            <div class="contact-form-cool">
                <form action="https://formspree.io/f/manwwqko" method="POST">
                    <label for="full-name">Full Name or Organization</label>
                    <input type="text" name="name" id="full-name" autocomplete="name" placeholder="Nancy Smith from Google LLC." required>
                    <label for="email-address">Email Address</label>
                    <input type="email" name="_replyto" id="email-address" autocomplete="email" placeholder="email@domain.tld" required>
                    <!-- this label pointed at for="subject" but the input had no
                         id, so clicking the label did nothing and screen readers
                         announced the field as unlabelled. -->
                    <label for="subject">Subject</label>
                    <input name="subject" id="subject" type="text" placeholder="Collaboration Opportunity">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" placeholder="Your message. Do not include confidential information." required></textarea>
                    <input type="hidden" name="_subject" id="email-subject" value="Contact Form Submission">
                    <button type="submit">Send Message</button>
                </form>
            </div>
        </div>
    </main>

    <!-- ===== site footer. keep this identical on every page too.
              icons come from /files/icons.svg -- one cached file, no Font Awesome. ===== -->
    <footer class="footer">
        <div class="footer-row">
            <div class="footer-social">
                <a href="https://www.linkedin.com/in/çağanefeçalıdağ" target="_blank" rel="noopener noreferrer me"><svg class="icon" aria-hidden="true" focusable="false"><use href="/files/icons.svg#linkedin"></use></svg> LinkedIn</a>
                <a href="https://github.com/MrBiscuitTR" target="_blank" rel="noopener noreferrer me"><svg class="icon" aria-hidden="true" focusable="false"><use href="/files/icons.svg#github"></use></svg> GitHub</a>
                <a href="https://www.instagram.com/cagancalidag/" target="_blank" rel="noopener noreferrer me"><svg class="icon" aria-hidden="true" focusable="false"><use href="/files/icons.svg#instagram"></use></svg> Instagram</a>
                <a href="https://www.twitter.com/Caganefe1" target="_blank" rel="noopener noreferrer me"><svg class="icon" aria-hidden="true" focusable="false"><use href="/files/icons.svg#twitter"></use></svg> Twitter</a>
            </div>
        </div>
        <div class="copyright-bottom">
            <!-- static year is the real one; dynamic-text.js just keeps it from
                 going stale. no document.write -- that blocks the parser. -->
            <p>© 2023-<span id="current-year">2026</span> Çağan Efe Çalıdağ, All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
